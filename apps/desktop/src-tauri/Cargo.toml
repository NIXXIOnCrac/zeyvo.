[package]
name = "zeyvo-desktop"
version = "0.1.0-alpha"
edition = "2021"
description = "ZEYVO — Your computer. Your companion. Native Windows AI companion"
authors = ["Zeyvo Team"]
license = "MIT"
repository = "https://github.com/NIXXIOnCrac/zeyvo."
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
keyring = "3.5"
obws = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Capture"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
